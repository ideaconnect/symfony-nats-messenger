name: CI

on:
  push:
    branches: [ main, new-client ]
  pull_request:
    branches: [ main, new-client ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40  # Whole-job cap: install + analysis + unit/coverage + mutation (8.5) + functional + benchmark

    # The oldest PHP runs against the lowest client release the transport allows, the newest PHP against
    # the latest client release, so CI tests the client versions users install (#52).
    strategy:
      matrix:
        include:
          - php-version: '8.2'
            client: lowest
          - php-version: '8.5'
            client: latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: igbinary, json, mbstring, pcntl, posix
        coverage: xdebug
        tools: composer:v2

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y netcat-openbsd

    # - name: Get composer cache directory
    #   id: composer-cache
    #   run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    # - name: Cache dependencies
    #   uses: actions/cache@v3
    #   with:
    #     path: ${{ steps.composer-cache.outputs.dir }}
    #     key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
    #     restore-keys: ${{ runner.os }}-composer-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Use the lowest client release the transport allows
      if: matrix.client == 'lowest'
      run: composer update idct/php-nats-jetstream-client --prefer-lowest --prefer-dist --no-progress

    - name: Show the client release under test
      run: composer show idct/php-nats-jetstream-client | grep -E '^versions'

    - name: Run static analysis and fast unit tests
      run: composer test

    - name: Start NATS servers
      run: |
        composer nats:start
        sleep 10

        # Wait for all NATS servers to be ready
        echo "Waiting for NATS (plain) on port 4222..."
        timeout 60 bash -c 'until nc -z localhost 4222; do sleep 2; done'
        echo "Waiting for NATS (TLS) on port 4223..."
        timeout 60 bash -c 'until nc -z localhost 4223; do sleep 2; done'
        echo "Waiting for NATS (mTLS) on port 4224..."
        timeout 60 bash -c 'until nc -z localhost 4224; do sleep 2; done'
        echo "Waiting for NATS (drops idle clients) on port 4225..."
        timeout 60 bash -c 'until nc -z localhost 4225; do sleep 2; done'
        echo "All NATS servers are ready"

        # Verify monitoring endpoints
        timeout 10 bash -c 'until curl -f http://localhost:8223/varz > /dev/null 2>&1; do sleep 1; done' || echo "NATS monitoring not available"
        timeout 10 bash -c 'until curl -f http://localhost:8224/varz > /dev/null 2>&1; do sleep 1; done' || echo "NATS TLS monitoring not available"
        timeout 10 bash -c 'until curl -f http://localhost:8225/varz > /dev/null 2>&1; do sleep 1; done' || echo "NATS mTLS monitoring not available"

        # Show container status
        docker ps --filter "name=nats"

    - name: Run unit tests with coverage
      run: composer test:unit

    - name: Check coverage threshold (90%)
      run: composer coverage:check

    - name: Run mutation tests
      if: matrix.php-version == '8.5'
      run: composer test:mutation

    - name: Install functional test dependencies
      run: composer test:functional:setup

    - name: Use the lowest client release in the functional test app
      if: matrix.client == 'lowest'
      working-directory: tests/functional
      run: composer update idct/php-nats-jetstream-client --prefer-lowest --prefer-dist --no-progress

    # The functional test app installs the client on its own, so make sure it runs the release the unit tests
    # above ran: otherwise the job would report the lowest release as tested while running another.
    - name: Check the functional test app runs the client release under test
      working-directory: tests/functional
      run: |
        APP=$(composer show idct/php-nats-jetstream-client | awk '/^versions/ {print $NF}')
        ROOT=$(composer --working-dir=../.. show idct/php-nats-jetstream-client | awk '/^versions/ {print $NF}')
        echo "functional test app: client $APP; unit tests: client $ROOT"
        [ "$APP" = "$ROOT" ] || { echo "::error::The functional test app runs client $APP, the unit tests ran $ROOT"; exit 1; }

    - name: Run functional tests
      timeout-minutes: 25  # Behat suite runs the full matrix (plain/TLS/mTLS) incl. high-volume, large-message and scheduled scenarios
      run: composer test:functional

    # Every examples/*.php must run and pass against the servers started above; strict mode makes a skipped
    # example fail the job too.
    - name: Run examples
      timeout-minutes: 5
      run: composer examples
      env:
        EXAMPLES_STRICT: "1"

    - name: Run benchmark tests
      timeout-minutes: 5  # Set explicit timeout for benchmark tests
      env:
        APP_ENV: test
        NATS_DSN: nats://localhost:4222
      run: composer test:benchmark -- --count 1000
      continue-on-error: true  # Don't fail the entire workflow if benchmark fails

    - name: Collect logs on failure
      if: failure()
      run: |
        echo "=== NATS Container Logs ==="
        docker logs nats_test || echo "Could not get NATS plain logs"
        docker logs nats_test_tls || echo "Could not get NATS TLS logs"
        docker logs nats_test_mtls || echo "Could not get NATS mTLS logs"
        docker logs nats_test_stale || echo "Could not get the logs of the NATS that drops idle clients"
        echo "=== Docker Containers ==="
        docker ps -a
        echo "=== Network Status ==="
        netstat -tlnp | grep -E ':422[2345]' || echo "NATS ports not listening"

    - name: Upload coverage reports
      uses: actions/upload-artifact@v7
      if: matrix.php-version == '8.5'
      with:
        name: coverage-report
        path: |
          clover.xml
          coverage/
        retention-days: 5

    - name: Upload benchmark results
      uses: actions/upload-artifact@v7
      if: matrix.php-version == '8.5'
      with:
        name: benchmark-results
        path: tests/functional/benchmark-*.txt
        retention-days: 5

    - name: Stop NATS server
      if: always()
      run: composer nats:stop

  # The matrix above runs against nats:alpine (latest). Several JetStream stream and consumer fields
  # are immutable on older servers and mutable on newer ones, so a latest-only matrix cannot see a
  # change that breaks setup() for users on the oldest server the README supports (^2.9). This job
  # runs the functional suite against that server. Scheduled messages need 2.12, so @delayed is
  # excluded here rather than failing for a documented reason.
  functional-oldest-nats:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Job-level, not step-level: the Behat context starts NATS itself with a plain
    # `docker compose up -d` whenever it finds port 4222 closed. Without NATS_IMAGE in the
    # environment that child process would recreate the containers from the default (latest)
    # image, and the job would quietly test the wrong server while still reporting success.
    env:
      NATS_IMAGE: nats:2.10-alpine

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.2
        extensions: igbinary, json, mbstring, pcntl, posix
        coverage: none
        tools: composer:v2

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y netcat-openbsd

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Start NATS servers (oldest supported)
      run: |
        composer nats:start
        sleep 10
        timeout 60 bash -c 'until nc -z localhost 4222; do sleep 2; done'
        timeout 60 bash -c 'until nc -z localhost 4223; do sleep 2; done'
        timeout 60 bash -c 'until nc -z localhost 4224; do sleep 2; done'
        timeout 60 bash -c 'until nc -z localhost 4225; do sleep 2; done'
        docker exec nats_test nats-server --version

    - name: Set up functional tests
      run: composer test:functional:setup

    - name: Run functional tests without the scheduled-message scenarios
      working-directory: tests/functional
      run: ./vendor/bin/behat --no-colors --tags '~@delayed'

    - name: Run examples against the oldest supported server
      timeout-minutes: 5
      run: composer examples
      env:
        EXAMPLES_STRICT: "1"

    # Belt and braces for the same hazard: if anything recreated the containers from the default
    # image mid-run, the suite above proved nothing about the oldest supported server.
    - name: Verify the suite really ran against the oldest supported server
      run: |
        VERSION=$(docker exec nats_test nats-server --version)
        echo "$VERSION"
        echo "$VERSION" | grep -q ' v2\.10\.' || {
          echo "::error::Expected a v2.10.x server, got: $VERSION"
          exit 1
        }

    - name: Stop NATS server
      if: always()
      run: composer nats:stop