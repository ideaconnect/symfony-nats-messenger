# NATS_IMAGE selects the server version. It defaults to nats:alpine (latest) for local work; CI also
# runs the functional suite against the oldest supported server, because several JetStream fields
# (max_consumers, replay_policy) are immutable on older versions and mutable on newer ones, so a
# latest-only matrix silently misses regressions for users on the ^2.9 range the README supports.
services:
  nats:
    image: ${NATS_IMAGE:-nats:alpine}
    container_name: nats_test
    restart: always
    command: -c /etc/nats/nats.conf
    ports:
      - "4222:4222" # client port
      - "6223:6222" # cluster port (changed to avoid conflict)
      - "8223:8222" # monitoring port (changed to avoid conflict)
    volumes:
      - ./nats.conf:/etc/nats/nats.conf
      - ./data:/data

  nats-tls:
    image: ${NATS_IMAGE:-nats:alpine}
    container_name: nats_test_tls
    restart: always
    command: -c /etc/nats/nats.conf
    ports:
      - "4223:4222" # TLS client port
      - "6224:6222" # TLS cluster port
      - "8224:8222" # TLS monitoring port
    volumes:
      - ./nats-tls.conf:/etc/nats/nats.conf
      - ./certs:/etc/nats/certs:ro
      - ./data-tls:/data

  nats-mtls:
    image: ${NATS_IMAGE:-nats:alpine}
    container_name: nats_test_mtls
    restart: always
    command: -c /etc/nats/nats.conf
    ports:
      - "4224:4222" # mTLS client port
      - "6225:6222" # mTLS cluster port
      - "8225:8222" # mTLS monitoring port
    volumes:
      - ./nats-mtls.conf:/etc/nats/nats.conf
      - ./certs:/etc/nats/certs:ro
      - ./data-mtls:/data

  # Drops a client that stops answering its pings within seconds (see nats-stale.conf), for the scenarios
  # of the transport's idle-connection check.
  nats-stale:
    image: ${NATS_IMAGE:-nats:alpine}
    container_name: nats_test_stale
    restart: always
    command: -c /etc/nats/nats.conf
    ports:
      - "4225:4222" # client port
      - "6226:6222" # cluster port
      - "8226:8222" # monitoring port
    volumes:
      - ./nats-stale.conf:/etc/nats/nats.conf
      - ./data-stale:/data
