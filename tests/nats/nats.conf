# The NKey user's public key, generated with the other test credentials and never committed (auth/README.md).
include ./auth/nkey-user.conf

# NATS Clients Port
port: 4222
# PID file shared with configuration reloader.
# pid_file: "/var/run/nats/nats.pid"
###############
#             #
# Monitoring  #
#             #
###############
http: 8222
debug:   true
trace:   true
server_name: nats-0
server_tags: [
    "mem:1Gi",
]
###################################
#                                 #
# NATS JetStream                  #
#                                 #
###################################
jetstream {
    max_mem:2G
    store_dir: "/data"
    max_file:10Gi
    unique_tag: "nats532"
}

lame_duck_grace_period: 10s
lame_duck_duration: 30s

authorization {
    default_permissions = {
        publish = {
            deny = ">"
        },
        subscribe = {
            deny = ">"
        }
    }
    ADMIN = {
        publish = ">"
        subscribe = ">"
    }
    # Everything but a pull from a consumer named "worker", of any stream: the server refuses those pulls with a
    # permissions violation (tests/functional/features/nats_pull_permission.feature, examples/refused-pull.php, #130).
    NO_PULL = {
        publish = {
            allow = ">"
            deny = "$JS.API.CONSUMER.MSG.NEXT.*.worker"
        }
        subscribe = ">"
    }

    users = [
        {user: admin, password: "password", permissions: $ADMIN}
        {user: nopull, password: "nopull", permissions: $NO_PULL}
        {nkey: $NKEY_TEST_USER, permissions: $ADMIN}
    ]
}
