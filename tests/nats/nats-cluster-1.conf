# Server 1 of the test cluster (see nats-cluster.conf). client_advertise is the address a client outside
# docker reaches it on, which the other servers pass on to their clients (INFO connect_urls) for failover.
server_name: nats_cluster_1
client_advertise: "127.0.0.1:4226"
server_tags: ["disk:ssd", "zone:a"]

include ./nats-cluster.conf
