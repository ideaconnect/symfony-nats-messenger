# What the three servers of the test cluster share (docker-compose.yaml, services nats-cluster-1 to 3).
# Each server's own file (nats-cluster-N.conf) sets its name, its tags and the address it advertises to
# clients, then includes this one. The examples that need a cluster run against it (examples/README.md).
port: 4222
http: 8222

# One JetStream cluster named "east" of three servers, which find each other through their routes on the
# compose network. A stream with three replicas needs all three; two keep it available.
cluster {
    name: east
    port: 6222
    routes: [
        nats-route://nats-cluster-1:6222
        nats-route://nats-cluster-2:6222
        nats-route://nats-cluster-3:6222
    ]
}

jetstream {
    max_mem: 256M
    max_file: 1G
    store_dir: "/data"
}

authorization {
    users = [
        {user: admin, password: "password"}
    ]
}
