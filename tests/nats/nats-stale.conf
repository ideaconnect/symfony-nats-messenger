# A server that drops idle clients within seconds, for the scenarios of the transport's idle-connection
# check (ping_after_idle). The server pings every second and closes a client that leaves more than one
# PING unanswered with -ERR 'Stale Connection', about three seconds after it went quiet. A PHP process does
# not answer pings between two transport calls, so any pause that long loses the connection, the way the
# defaults (ping_interval 2m, ping_max 2) lose it after about six minutes.
port: 4222
http: 8222
server_name: nats-stale
ping_interval: "1s"
ping_max: 1

jetstream {
    max_mem: 1G
    store_dir: "/data"
    max_file: 1Gi
}

authorization {
    users = [
        {user: admin, password: "password"}
    ]
}
