# A server in operator mode, for the scenarios and the example of JWT login. It has no list of users: it trusts
# the operator in auth/resolver.conf, and a user logs in with a JWT its account signed and a signature made with
# the user's seed. This takes the place of an authorization block, so it cannot share nats.conf. The credentials are
# generated and never committed, see auth/README.md.
port: 4222
server_name: nats-jwt

# JetStream data stays inside the container, and `composer nats:stop` removes it.
jetstream {
    max_mem: 256M
    max_file: 1G
    store_dir: "/data"
}

include ./auth/resolver.conf
