# A server whose clients log in with a token, for the scenarios and the example of token login. A token cannot sit
# next to a list of users ("Can not have a token and a users array"), so it cannot share nats.conf. The token is
# for the tests only.
port: 4222
server_name: nats-token

# JetStream data stays inside the container, and `composer nats:stop` removes it.
jetstream {
    max_mem: 256M
    max_file: 1G
    store_dir: "/data"
}

authorization {
    token: "test-only-token"
}
